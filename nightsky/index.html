<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>나만의 밤하늘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  touch-action: none;
}

/* 밤하늘 배경 */
#sky {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, #0a1628 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, #06101f 0%, transparent 60%),
    radial-gradient(ellipse at 50% 80%, #0b1a33 0%, transparent 50%),
    linear-gradient(180deg, #060d1a 0%, #0a1628 30%, #0d1f3a 60%, #081422 100%);
  background-color: #060d1a;
}

#stars-layer { position: fixed; inset: 0; pointer-events: none; }
.bg-star {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  opacity: var(--opa);
}
@keyframes twinkle {
  0%, 100% { opacity: var(--opa); transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* 캔버스 */
#canvas { position: fixed; inset: 0; z-index: 10; }
.placed-item {
  position: absolute;
  cursor: grab;
  user-select: none;
  transition: filter 0.2s;
  animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1);
}
.placed-item:hover { filter: brightness(1.15) drop-shadow(0 0 8px rgba(255,255,255,0.3)); }
.placed-item:active { cursor: grabbing; }
@keyframes popIn {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes deleteOut {
  to { transform: scale(0); opacity: 0; }
}

/* ========== 별똥별 ========== */
.shooting-star {
  width: 70px; height: 3px;
  background: linear-gradient(90deg, #fff 0%, rgba(200,220,255,0.6) 40%, transparent 100%);
  border-radius: 3px;
  transform: rotate(-35deg);
  box-shadow: 0 0 8px 2px rgba(200,220,255,0.5);
}

/* ========== 달 ========== */
.moon {
  width: 55px; height: 55px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 65% 35%, rgba(180,180,200,0.4) 0%, transparent 25%),
    radial-gradient(circle at 30% 70%, rgba(150,150,180,0.3) 0%, transparent 20%),
    radial-gradient(circle at 45% 25%, rgba(160,160,190,0.3) 0%, transparent 15%),
    radial-gradient(circle at 35% 30%, #fafafa, #e8e4f0 40%, #c8c0d8 70%, #9890a8);
  box-shadow:
    0 0 40px 12px rgba(220,215,240,0.25),
    inset -6px -4px 12px rgba(100,90,120,0.3);
}

/* ========== 행성 — 마블링 유화 스타일 ========== */
.planet {
  width: 55px; height: 55px;
  border-radius: 50%;
  box-shadow:
    inset -10px -6px 20px rgba(0,0,0,0.5),
    0 0 25px rgba(150,120,200,0.2);
  position: relative;
}
/* 홀로그래픽 마블 - 핑크/민트/노랑 소용돌이 */
.planet-holo {
  background:
    radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.3) 0%, transparent 35%),
    conic-gradient(from 120deg at 40% 50%,
      #c8a0d4, #7bc8c4, #e8c090, #d4a0c8, #90b8d4, #c8a0d4);
  background-size: 100% 100%, 100% 100%;
}
/* 핑크 마블 행성 */
.planet-rose {
  background:
    radial-gradient(ellipse at 25% 30%, rgba(255,255,255,0.25) 0%, transparent 30%),
    linear-gradient(160deg, #f0a0b0 0%, #d06080 30%, #e0b0a0 50%, #c06070 70%, #f0c0b0 100%);
}
/* 아이스 블루 행성 */
.planet-ice {
  background:
    radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.35) 0%, transparent 30%),
    linear-gradient(140deg, #c0d8f0 0%, #80a8d0 25%, #d0e0f0 45%, #90b8e0 65%, #f0e8f8 100%);
}
/* 보라 소용돌이 행성 */
.planet-violet {
  background:
    radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.2) 0%, transparent 30%),
    conic-gradient(from 60deg at 50% 50%,
      #8040a0, #c060a0, #f0a080, #d080c0, #6030a0, #8040a0);
}
/* 토성 (고리 있는) */
.planet-saturn {
  background:
    radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 30%),
    linear-gradient(150deg, #e8c8a0, #d0a070, #f0d8b0, #c89060);
}
.planet-saturn::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 90px; height: 22px;
  border: 3px solid;
  border-color: rgba(240,200,100,0.5) rgba(180,140,200,0.4) rgba(100,200,180,0.4) rgba(240,160,200,0.5);
  border-radius: 50%;
  transform: translate(-50%, -50%) rotateX(65deg);
}

/* ========== 구름 — 문스톤/오팔 오로라 ========== */
.cloud {
  width: 70px; height: 36px;
  border-radius: 20px 22px 18px 20px;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(130,180,255,0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 30%, rgba(180,200,240,0.4) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 70%, rgba(100,140,200,0.3) 0%, transparent 45%),
    linear-gradient(135deg,
      rgba(200,215,240,0.7) 0%,
      rgba(140,170,220,0.5) 25%,
      rgba(100,130,180,0.4) 50%,
      rgba(160,180,210,0.5) 75%,
      rgba(200,210,230,0.6) 100%);
  box-shadow:
    0 0 15px 4px rgba(150,180,240,0.15),
    inset 0 2px 8px rgba(255,255,255,0.3),
    inset 0 -2px 6px rgba(80,100,150,0.2);
  animation: cloudShimmer 4s ease-in-out infinite alternate;
}
@keyframes cloudShimmer {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(15deg) brightness(1.05); }
}

/* ========== 보석 — 미스틱 토파즈 방사형 커팅 ========== */
/* 원형 (라운드 브릴리언트) */
.gem-round {
  width: 42px; height: 42px;
  border-radius: 50%;
  background:
    conic-gradient(from 0deg,
      #ff3399, #cc33ff, #3366ff, #33ffcc,
      #99ff33, #ffcc00, #ff6633, #ff3399,
      #9933ff, #33ccff, #33ff66, #ffff33,
      #ff3399);
  box-shadow:
    inset 0 0 10px rgba(255,255,255,0.7),
    inset 0 0 20px rgba(255,255,255,0.3),
    0 0 15px rgba(200,100,255,0.5);
  position: relative;
}
.gem-round::after {
  content: '';
  position: absolute; inset: 6px;
  border-radius: 50%;
  background: conic-gradient(from 180deg,
    rgba(255,100,200,0.6), rgba(100,200,255,0.6),
    rgba(100,255,150,0.6), rgba(255,200,50,0.6),
    rgba(255,100,200,0.6));
  filter: blur(2px);
}

/* 사각형 (에메랄드 컷) */
.gem-square {
  width: 38px; height: 38px;
  border-radius: 4px;
  background:
    conic-gradient(from 45deg,
      #7b2ff7, #2fd4f7, #5ef78c, #f7e62f,
      #f77b2f, #f72f7b, #7b2ff7);
  box-shadow:
    inset 0 0 8px rgba(255,255,255,0.6),
    inset 3px 3px 6px rgba(255,255,255,0.3),
    inset -3px -3px 6px rgba(0,0,0,0.2),
    0 0 12px rgba(120,80,255,0.5);
  position: relative;
}
.gem-square::after {
  content: '';
  position: absolute; inset: 5px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.3);
  background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
}

/* 타원형 (오벌) */
.gem-oval {
  width: 44px; height: 34px;
  border-radius: 50%;
  background:
    conic-gradient(from 90deg,
      #e040a0, #40e0d0, #e0e040, #a040e0,
      #40a0e0, #e08040, #e040a0);
  box-shadow:
    inset 0 0 12px rgba(255,255,255,0.5),
    0 0 14px rgba(180,80,220,0.4);
  position: relative;
}
.gem-oval::after {
  content: '';
  position: absolute; inset: 5px;
  border-radius: 50%;
  background: radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.5) 0%, transparent 50%);
}

/* 쿠션 (라운드 스퀘어) */
.gem-cushion {
  width: 40px; height: 40px;
  border-radius: 30%;
  background:
    conic-gradient(from 30deg,
      #ff6ec7, #8b5cf6, #06b6d4, #10b981,
      #f59e0b, #ef4444, #ff6ec7);
  box-shadow:
    inset 0 0 14px rgba(255,255,255,0.6),
    inset 0 0 4px rgba(0,0,0,0.3),
    0 0 18px rgba(139,92,246,0.5);
  position: relative;
}
.gem-cushion::after {
  content: '';
  position: absolute; inset: 4px;
  border-radius: 30%;
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.6) 0%, transparent 40%),
    conic-gradient(from 210deg,
      rgba(255,100,200,0.4), rgba(80,200,255,0.4),
      rgba(100,255,150,0.4), rgba(255,200,80,0.4),
      rgba(255,100,200,0.4));
}

/* 삼각형 (트릴리언 컷) */
.gem-triangle {
  width: 40px; height: 36px;
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  background:
    conic-gradient(from 0deg at 50% 60%,
      #ff3399, #9933ff, #3399ff, #33ff99,
      #ffff33, #ff6633, #ff3399);
  box-shadow: 0 0 15px rgba(255,50,150,0.5);
  position: relative;
}

/* 하트형 */
.gem-heart {
  width: 38px; height: 36px;
  position: relative;
}
.gem-heart::before, .gem-heart::after {
  content: '';
  position: absolute;
  width: 22px; height: 34px;
  border-radius: 22px 22px 0 0;
  background:
    conic-gradient(from 0deg,
      #ff69b4, #ff1493, #c71585, #ff69b4,
      #ff85c8, #ff1493, #ff69b4);
  box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
}
.gem-heart::before {
  left: 1px; top: 0;
  transform: rotate(-45deg);
  transform-origin: bottom right;
}
.gem-heart::after {
  right: 1px; top: 0;
  transform: rotate(45deg);
  transform-origin: bottom left;
}

/* 보석 공통 애니메이션 */
.gem-round, .gem-square, .gem-oval, .gem-cushion, .gem-triangle {
  animation: gemGlow 5s ease-in-out infinite alternate;
}
@keyframes gemGlow {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(40deg) brightness(1.15); }
}

/* ========== 팔레트 UI ========== */
#palette {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(8,12,24,0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 12px 16px 22px;
}
.palette-title {
  color: rgba(255,255,255,0.4);
  font-size: 0.7rem;
  margin-bottom: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.palette-items {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 6px;
  align-items: center;
}
.palette-items::-webkit-scrollbar { height: 3px; }
.palette-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
.palette-btn {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  user-select: none;
}
.palette-btn:hover {
  background: rgba(255,255,255,0.08);
  transform: scale(1.05);
  box-shadow: 0 0 12px rgba(150,130,255,0.15);
}
.palette-btn:active { transform: scale(0.92); }
.palette-btn .preview {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
}
.palette-btn .preview > * { transform: scale(0.7); }
.palette-btn .label {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.5);
  white-space: nowrap;
}

/* ========== 인트로 ========== */
#intro-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(6,13,26,0.92);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.5s;
}
#intro-overlay.hidden { display: none; }
.intro-box { text-align: center; color: #fff; padding: 40px; }
.intro-emoji { font-size: 3rem; margin-bottom: 16px; }
.intro-box h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 10px; }
.intro-box p { font-size: 0.85rem; opacity: 0.6; line-height: 1.7; margin-bottom: 24px; }
#intro-close {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 10px 30px;
  border-radius: 24px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.2s;
}
#intro-close:hover { background: rgba(255,255,255,0.18); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="sky"></div>
<div id="stars-layer"></div>
<div id="canvas"></div>

<!-- 하단 도구 팔레트 -->
<div id="palette">
  <div class="palette-title">꾸미기</div>
  <div class="palette-items" id="paletteItems"></div>
</div>

<!-- 안내 오버레이 -->
<div id="intro-overlay">
  <div class="intro-box">
    <div class="intro-emoji">&#127769;</div>
    <h2>나만의 밤하늘을 꾸며보세요</h2>
    <p>아래 팔레트에서 아이템을 클릭하면 하늘에 배치됩니다<br>배치된 것을 끌어서 이동하고, 더블클릭하면 삭제돼요</p>
    <button id="intro-close">시작하기</button>
  </div>
</div>
<script>
// === 배경 별 생성 ===
(function createStars() {
  var layer = document.getElementById('stars-layer');
  for (var i = 0; i < 200; i++) {
    var star = document.createElement('div');
    star.className = 'bg-star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    star.style.setProperty('--opa', (0.15 + Math.random() * 0.5).toString());
    var size = 1 + Math.random() * 2;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    layer.appendChild(star);
  }
})();

// === 팔레트 아이템 정의 ===
var ITEMS = [
  { id: 'shooting-star', label: '별똥별', html: '<div class="shooting-star"></div>' },
  { id: 'moon', label: '달', html: '<div class="moon"></div>' },
  { id: 'planet-holo', label: '홀로 행성', html: '<div class="planet planet-holo"></div>' },
  { id: 'planet-rose', label: '장미 행성', html: '<div class="planet planet-rose"></div>' },
  { id: 'planet-ice', label: '얼음 행성', html: '<div class="planet planet-ice"></div>' },
  { id: 'planet-violet', label: '보라 행성', html: '<div class="planet planet-violet"></div>' },
  { id: 'planet-saturn', label: '토성', html: '<div class="planet planet-saturn"></div>' },
  { id: 'cloud', label: '구름', html: '<div class="cloud"></div>' },
  { id: 'gem-round', label: '원형 보석', html: '<div class="gem-round"></div>' },
  { id: 'gem-square', label: '사각 보석', html: '<div class="gem-square"></div>' },
  { id: 'gem-oval', label: '타원 보석', html: '<div class="gem-oval"></div>' },
  { id: 'gem-cushion', label: '쿠션 보석', html: '<div class="gem-cushion"></div>' },
  { id: 'gem-triangle', label: '삼각 보석', html: '<div class="gem-triangle"></div>' },
  { id: 'gem-heart', label: '하트 보석', html: '<div class="gem-heart"></div>' }
];

// === 팔레트 렌더링 ===
var paletteEl = document.getElementById('paletteItems');
ITEMS.forEach(function(item) {
  var btn = document.createElement('div');
  btn.className = 'palette-btn';
  btn.setAttribute('data-item-id', item.id);
  btn.innerHTML = '<div class="preview">' + item.html + '</div><span class="label">' + item.label + '</span>';
  paletteEl.appendChild(btn);
});

// === 상태 관리 ===
var canvas = document.getElementById('canvas');
var dragging = null;
var dragOffset = { x: 0, y: 0 };

function getPos(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

// === 팔레트 클릭 → 랜덤 배치 ===
paletteEl.addEventListener('click', function(e) {
  var btn = e.target.closest('.palette-btn');
  if (!btn) return;
  var itemId = btn.getAttribute('data-item-id');
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  if (!item) return;

  var el = document.createElement('div');
  el.className = 'placed-item';
  el.innerHTML = item.html;

  // 팔레트 높이를 뺀 영역에서 랜덤 배치
  var paletteH = document.getElementById('palette').offsetHeight;
  var maxX = window.innerWidth - 80;
  var maxY = window.innerHeight - paletteH - 80;
  var rx = 40 + Math.random() * maxX;
  var ry = 40 + Math.random() * maxY;
  el.style.left = rx + 'px';
  el.style.top = ry + 'px';

  canvas.appendChild(el);
  saveState();
});

// === 캔버스 위 기존 아이템 드래그 ===
canvas.addEventListener('pointerdown', function(e) {
  var el = e.target.closest('.placed-item');
  if (!el) return;
  e.preventDefault();
  var pos = getPos(e);
  var rect = el.getBoundingClientRect();
  dragOffset = { x: pos.x - rect.left, y: pos.y - rect.top };
  dragging = el;
  el.style.zIndex = Date.now();
  document.body.style.cursor = 'grabbing';
});

document.addEventListener('pointermove', function(e) {
  if (!dragging) return;
  e.preventDefault();
  var pos = getPos(e);
  dragging.style.left = (pos.x - dragOffset.x) + 'px';
  dragging.style.top = (pos.y - dragOffset.y) + 'px';
});

document.addEventListener('pointerup', function() {
  if (!dragging) return;
  dragging = null;
  document.body.style.cursor = '';
  saveState();
});

// === 더블클릭으로 삭제 ===
canvas.addEventListener('dblclick', function(e) {
  var el = e.target.closest('.placed-item');
  if (!el) return;
  el.style.animation = 'deleteOut 0.25s forwards';
  setTimeout(function() { el.remove(); saveState(); }, 250);
});

// === 인트로 닫기 ===
document.getElementById('intro-close').addEventListener('click', function() {
  document.getElementById('intro-overlay').classList.add('hidden');
  localStorage.setItem('nightsky-intro-seen', '1');
});
if (localStorage.getItem('nightsky-intro-seen')) {
  document.getElementById('intro-overlay').classList.add('hidden');
}

// === localStorage 저장/복원 ===
function saveState() {
  var items = [];
  canvas.querySelectorAll('.placed-item').forEach(function(el) {
    items.push({ html: el.innerHTML, left: el.style.left, top: el.style.top });
  });
  localStorage.setItem('nightsky-state', JSON.stringify(items));
}

function loadState() {
  var saved = localStorage.getItem('nightsky-state');
  if (!saved) return;
  try {
    var items = JSON.parse(saved);
    items.forEach(function(data) {
      var el = document.createElement('div');
      el.className = 'placed-item';
      el.innerHTML = data.html;
      el.style.left = data.left;
      el.style.top = data.top;
      el.style.animation = 'none';
      canvas.appendChild(el);
    });
  } catch(e) {}
}
loadState();
</script>

</body>
</html>
