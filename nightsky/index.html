<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>나만의 밤하늘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  touch-action: none;
}

/* 밤하늘 배경 */
#sky {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, #0a1628 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, #06101f 0%, transparent 60%),
    radial-gradient(ellipse at 50% 80%, #0b1a33 0%, transparent 50%),
    linear-gradient(180deg, #060d1a 0%, #0a1628 30%, #0d1f3a 60%, #081422 100%);
  background-color: #060d1a;
}

/* 별 */
#stars-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.bg-star {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  opacity: var(--opa);
}
@keyframes twinkle {
  0%, 100% { opacity: var(--opa); transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* 어둠 레이어 — 오브젝트가 없으면 화면이 어둡다 */
#dark-layer {
  position: fixed; inset: 0;
  background: rgba(2, 4, 12, 0.75);
  z-index: 2;
  pointer-events: none;
  transition: background 0.8s;
}

/* 빛 레이어 — 각 오브젝트 위치에 빛 방출 */
#glow-layer {
  position: fixed; inset: 0;
  z-index: 3;
  pointer-events: none;
}
.glow-point {
  position: absolute;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(180,160,255,0.25) 0%, rgba(100,140,220,0.1) 35%, transparent 70%);
  transform: translate(-50%, -50%);
  animation: glowPulse 3s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes glowPulse {
  0% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
}

/* 캔버스 */
#canvas { position: fixed; inset: 0; z-index: 10; }
.placed-item {
  position: absolute;
  cursor: grab;
  user-select: none;
  animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
}
.placed-item:active { cursor: grabbing; }
@keyframes popIn {
  0% { transform: scale(0) rotate(-15deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes deleteOut {
  to { transform: scale(0) rotate(10deg); opacity: 0; }
}

/* ========== 별똥별 ========== */
.shooting-star {
  width: 80px; height: 3px;
  background: linear-gradient(90deg, #fff 0%, rgba(200,220,255,0.6) 40%, transparent 100%);
  border-radius: 3px;
  transform: rotate(-35deg);
  box-shadow: 0 0 10px 2px rgba(200,220,255,0.5);
}

/* ========== 달 ========== */
.moon {
  width: 55px; height: 55px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 65% 35%, rgba(180,180,200,0.4) 0%, transparent 25%),
    radial-gradient(circle at 30% 70%, rgba(150,150,180,0.3) 0%, transparent 20%),
    radial-gradient(circle at 35% 30%, #fafafa, #e8e4f0 40%, #c8c0d8 70%, #9890a8);
  box-shadow:
    0 0 40px 12px rgba(220,215,240,0.3),
    inset -6px -4px 12px rgba(100,90,120,0.3);
}

/* ========== 행성 ========== */
.planet {
  width: 55px; height: 55px;
  border-radius: 50%;
  box-shadow: inset -10px -6px 20px rgba(0,0,0,0.5), 0 0 25px rgba(150,120,200,0.2);
  position: relative;
}
.planet-holo {
  background:
    radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.3) 0%, transparent 35%),
    conic-gradient(from 120deg at 40% 50%, #c8a0d4, #7bc8c4, #e8c090, #d4a0c8, #90b8d4, #c8a0d4);
}
.planet-rose {
  background:
    radial-gradient(ellipse at 25% 30%, rgba(255,255,255,0.25) 0%, transparent 30%),
    linear-gradient(160deg, #f0a0b0 0%, #d06080 30%, #e0b0a0 50%, #c06070 70%, #f0c0b0 100%);
}
.planet-ice {
  background:
    radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.35) 0%, transparent 30%),
    linear-gradient(140deg, #c0d8f0 0%, #80a8d0 25%, #d0e0f0 45%, #90b8e0 65%, #f0e8f8 100%);
}
.planet-violet {
  background:
    radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.2) 0%, transparent 30%),
    conic-gradient(from 60deg at 50% 50%, #8040a0, #c060a0, #f0a080, #d080c0, #6030a0, #8040a0);
}
.planet-saturn {
  background:
    radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 30%),
    linear-gradient(150deg, #e8c8a0, #d0a070, #f0d8b0, #c89060);
}
.planet-saturn::after {
  content: '';
  position: absolute; top: 50%; left: 50%;
  width: 90px; height: 22px;
  border: 3px solid;
  border-color: rgba(240,200,100,0.5) rgba(180,140,200,0.4) rgba(100,200,180,0.4) rgba(240,160,200,0.5);
  border-radius: 50%;
  transform: translate(-50%, -50%) rotateX(65deg);
}

/* ========== 구름 — 문스톤 오로라 ========== */
.cloud {
  width: 70px; height: 36px;
  border-radius: 20px 22px 18px 20px;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(130,180,255,0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 30%, rgba(180,200,240,0.4) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 70%, rgba(100,140,200,0.3) 0%, transparent 45%),
    linear-gradient(135deg,
      rgba(200,215,240,0.7) 0%,
      rgba(140,170,220,0.5) 25%,
      rgba(100,130,180,0.4) 50%,
      rgba(160,180,210,0.5) 75%,
      rgba(200,210,230,0.6) 100%);
  box-shadow:
    0 0 15px 4px rgba(150,180,240,0.15),
    inset 0 2px 8px rgba(255,255,255,0.3),
    inset 0 -2px 6px rgba(80,100,150,0.2);
  animation: cloudShimmer 4s ease-in-out infinite alternate;
}
@keyframes cloudShimmer {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(15deg) brightness(1.08); }
}

/* ========== 보석 — 이미지로 대체됨, CSS gem은 제거 ========== */

@keyframes opalShift {
  0% { filter: hue-rotate(0deg) brightness(1) saturate(1); }
  100% { filter: hue-rotate(25deg) brightness(1.1) saturate(1.1); }
}

/* ========== 보석 이미지 스타일 ========== */
.gem-img {
  width: 55px; height: 55px;
  object-fit: contain;
  pointer-events: none;
  filter: drop-shadow(0 0 8px rgba(150,100,255,0.4));
  animation: opalShift 6s ease-in-out infinite alternate;
}
.gem-img.gem-tall {
  width: 30px; height: 60px;
}
.palette-btn .preview .gem-img {
  width: 34px; height: 34px;
}
.palette-btn .preview .gem-img.gem-tall {
  width: 18px; height: 34px;
}

/* ========== 팔레트 ========== */
#palette {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(6,10,20,0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 12px 16px 22px;
}
.palette-title {
  color: rgba(255,255,255,0.35);
  font-size: 0.65rem;
  margin-bottom: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.palette-items {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
  align-items: center;
}
.palette-items::-webkit-scrollbar { height: 3px; }
.palette-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.palette-btn {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  background: rgba(255,255,255,0.02);
  transition: background 0.2s, transform 0.15s;
  user-select: none;
}
.palette-btn:hover {
  background: rgba(255,255,255,0.07);
  transform: scale(1.06);
}
.palette-btn:active { transform: scale(0.9); }
.palette-btn .preview {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
}
.palette-btn .preview > * { transform: scale(0.65); }
.palette-btn .preview > img.gem-img { transform: scale(1); }
.palette-btn .label {
  font-size: 0.55rem;
  color: rgba(255,255,255,0.45);
  white-space: nowrap;
}

/* ========== 인트로 ========== */
#intro-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(4,8,18,0.93);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.6s;
}
#intro-overlay.hidden { display: none; }
.intro-box { text-align: center; color: #fff; padding: 40px; }
.intro-emoji { font-size: 3rem; margin-bottom: 16px; }
.intro-box h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 12px; }
.intro-box p { font-size: 0.85rem; opacity: 0.55; line-height: 1.7; margin-bottom: 26px; }
#intro-close {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  padding: 11px 32px;
  border-radius: 24px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.2s;
}
#intro-close:hover { background: rgba(255,255,255,0.15); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ========== 오르골 음악 토글 ========== */
#musicToggle {
  position: fixed;
  top: 16px; right: 16px;
  z-index: 50;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(6,10,20,0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #fff;
  font-size: 1.15rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.15s, background 0.2s;
}
#musicToggle:hover { background: rgba(255,255,255,0.1); }
#musicToggle:active { transform: scale(0.9); }
#musicToggle.playing { animation: musicPulse 1.6s ease-in-out infinite; }
@keyframes musicPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(180,160,255,0.35); }
  50% { box-shadow: 0 0 0 8px rgba(180,160,255,0); }
}
</style>
</head>
<body>
<div id="sky"></div>
<div id="stars-layer"></div>
<div id="dark-layer"></div>
<div id="glow-layer"></div>
<div id="canvas"></div>

<button id="musicToggle" title="오르골 음악">🎵</button>

<!-- 하단 팔레트 -->
<div id="palette">
  <div class="palette-title">꾸미기</div>
  <div class="palette-items" id="paletteItems"></div>
</div>

<!-- 안내 -->
<div id="intro-overlay">
  <div class="intro-box">
    <div class="intro-emoji">&#127769;</div>
    <h2>나만의 밤하늘을 꾸며보세요</h2>
    <p>아래 팔레트에서 아이템을 클릭하면 하늘에 나타나요<br>드래그해서 이동, 더블클릭으로 삭제할 수 있어요</p>
    <button id="intro-close">시작하기</button>
  </div>
</div>
<script>
// === 배경 별 ===
(function() {
  var layer = document.getElementById('stars-layer');
  for (var i = 0; i < 180; i++) {
    var s = document.createElement('div');
    s.className = 'bg-star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    s.style.setProperty('--opa', (0.15 + Math.random() * 0.45).toString());
    var sz = 1 + Math.random() * 2;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    layer.appendChild(s);
  }
})();

// === 아이템 정의 ===
var ITEMS = [
  { id: 'shooting-star', label: '별똥별', html: '<div class="shooting-star"></div>', glow: 'rgba(200,220,255,0.2)' },
  { id: 'moon', label: '달', html: '<div class="moon"></div>', glow: 'rgba(240,235,200,0.3)' },
  { id: 'planet-holo', label: '홀로 행성', html: '<div class="planet planet-holo"></div>', glow: 'rgba(180,160,220,0.25)' },
  { id: 'planet-rose', label: '장미 행성', html: '<div class="planet planet-rose"></div>', glow: 'rgba(240,140,160,0.2)' },
  { id: 'planet-ice', label: '얼음 행성', html: '<div class="planet planet-ice"></div>', glow: 'rgba(140,180,240,0.25)' },
  { id: 'planet-violet', label: '보라 행성', html: '<div class="planet planet-violet"></div>', glow: 'rgba(160,80,200,0.25)' },
  { id: 'planet-saturn', label: '토성', html: '<div class="planet planet-saturn"></div>', glow: 'rgba(220,180,100,0.2)' },
  { id: 'cloud', label: '구름', html: '<div class="cloud"></div>', glow: 'rgba(150,180,240,0.15)' },
  { id: 'gem-opal-light', label: '라이트 오팔', html: '<img class="gem-img" src="gems/twinkle.png" draggable="false">', glow: 'rgba(180,140,255,0.35)' },
  { id: 'gem-crystal', label: '크리스탈', html: '<img class="gem-img gem-tall" src="gems/crystal.png" draggable="false">', glow: 'rgba(100,80,200,0.3)' },
  { id: 'gem-opal-fire', label: '파이어 오팔', html: '<img class="gem-img" src="gems/garaxy.png" draggable="false">', glow: 'rgba(255,160,60,0.3)' },
  { id: 'gem-opal-black', label: '블랙 오팔', html: '<img class="gem-img" src="gems/garaxy2.png" draggable="false">', glow: 'rgba(80,50,200,0.35)' },
  { id: 'gem-mystic-star', label: '미스틱 스타', html: '<img class="gem-img" src="gems/jewelry.png" draggable="false">', glow: 'rgba(139,32,224,0.3)' },
  { id: 'gem-rainbow', label: '프리즘', html: '<img class="gem-img" src="gems/jewelry2.png" draggable="false">', glow: 'rgba(200,100,255,0.35)' }
];

// === 팔레트 렌더링 ===
var paletteEl = document.getElementById('paletteItems');
ITEMS.forEach(function(item) {
  var btn = document.createElement('div');
  btn.className = 'palette-btn';
  btn.setAttribute('data-item-id', item.id);
  btn.innerHTML = '<div class="preview">' + item.html + '</div><span class="label">' + item.label + '</span>';
  paletteEl.appendChild(btn);
});

// === 빛 효과 관리 ===
var glowLayer = document.getElementById('glow-layer');
var darkLayer = document.getElementById('dark-layer');
var canvas = document.getElementById('canvas');

function updateGlows() {
  // 기존 빛 제거
  glowLayer.innerHTML = '';
  var items = canvas.querySelectorAll('.placed-item');

  if (items.length === 0) {
    darkLayer.style.background = 'rgba(2, 4, 12, 0.75)';
    return;
  }

  // 오브젝트가 있으면 어둠을 약간 줄임
  var darkness = Math.max(0.3, 0.75 - items.length * 0.03);
  darkLayer.style.background = 'rgba(2, 4, 12, ' + darkness + ')';

  // 각 아이템 위치에 빛 생성
  items.forEach(function(el) {
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var color = el.getAttribute('data-glow') || 'rgba(180,160,255,0.2)';

    var glow = document.createElement('div');
    glow.className = 'glow-point';
    glow.style.left = cx + 'px';
    glow.style.top = cy + 'px';
    glow.style.background = 'radial-gradient(circle, ' + color + ' 0%, transparent 70%)';
    // 랜덤 딜레이로 일렁임이 서로 다르게
    glow.style.animationDelay = (Math.random() * 2) + 's';
    glow.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    glowLayer.appendChild(glow);
  });
}

// === 드래그 ===
var dragging = null;
var dragOffset = { x: 0, y: 0 };

// 팔레트 클릭 → 랜덤 배치
paletteEl.addEventListener('click', function(e) {
  var btn = e.target.closest('.palette-btn');
  if (!btn) return;
  var itemId = btn.getAttribute('data-item-id');
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  if (!item) return;

  var el = document.createElement('div');
  el.className = 'placed-item';
  el.innerHTML = item.html;
  el.setAttribute('data-glow', item.glow);

  var paletteH = document.getElementById('palette').offsetHeight;
  var maxX = window.innerWidth - 80;
  var maxY = window.innerHeight - paletteH - 80;
  el.style.left = (40 + Math.random() * maxX) + 'px';
  el.style.top = (40 + Math.random() * maxY) + 'px';

  canvas.appendChild(el);
  saveState();
  updateGlows();
});

// 드래그 시작
canvas.addEventListener('pointerdown', function(e) {
  var el = e.target.closest('.placed-item');
  if (!el) return;
  e.preventDefault();
  var rect = el.getBoundingClientRect();
  dragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  dragging = el;
  el.style.zIndex = Date.now() % 100000;
  document.body.style.cursor = 'grabbing';
});

document.addEventListener('pointermove', function(e) {
  if (!dragging) return;
  e.preventDefault();
  dragging.style.left = (e.clientX - dragOffset.x) + 'px';
  dragging.style.top = (e.clientY - dragOffset.y) + 'px';
  updateGlows();
});

document.addEventListener('pointerup', function() {
  if (!dragging) return;
  dragging = null;
  document.body.style.cursor = '';
  saveState();
  updateGlows();
});

// 더블클릭 삭제
canvas.addEventListener('dblclick', function(e) {
  var el = e.target.closest('.placed-item');
  if (!el) return;
  el.style.animation = 'deleteOut 0.25s forwards';
  setTimeout(function() {
    el.remove();
    saveState();
    updateGlows();
  }, 250);
});

// === 오르골 음악 (반짝반짝 작은별 / Ah! vous dirai-je, Maman — 저작권 없는 전래 멜로디) ===
var Music = (function(){
  var NOTE = {
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88, C5:523.25
  };
  // [음, 박자] — 1박 = beatSec
  var MELODY = [
    [NOTE.C4,1],[NOTE.C4,1],[NOTE.G4,1],[NOTE.G4,1],[NOTE.A4,1],[NOTE.A4,1],[NOTE.G4,2],
    [NOTE.F4,1],[NOTE.F4,1],[NOTE.E4,1],[NOTE.E4,1],[NOTE.D4,1],[NOTE.D4,1],[NOTE.C4,2],
    [NOTE.G4,1],[NOTE.G4,1],[NOTE.F4,1],[NOTE.F4,1],[NOTE.E4,1],[NOTE.E4,1],[NOTE.D4,2],
    [NOTE.G4,1],[NOTE.G4,1],[NOTE.F4,1],[NOTE.F4,1],[NOTE.E4,1],[NOTE.E4,1],[NOTE.D4,2],
    [NOTE.C4,1],[NOTE.C4,1],[NOTE.G4,1],[NOTE.G4,1],[NOTE.A4,1],[NOTE.A4,1],[NOTE.G4,2],
    [NOTE.F4,1],[NOTE.F4,1],[NOTE.E4,1],[NOTE.E4,1],[NOTE.D4,1],[NOTE.D4,1],[NOTE.C4,2]
  ];
  var BEAT_SEC = 0.42;
  var LOOP_GAP_SEC = 1.4;

  var ctx = null, master = null, playing = false, timerId = null;

  function ensureCtx(){
    if (!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
    }
    return ctx;
  }

  function pluck(freq, startTime, beats){
    var dur = beats * BEAT_SEC;
    var ring = dur * 2.4; // 오르골 특유의 길게 울리는 잔향

    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.9, startTime + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + ring);
    osc.connect(gain).connect(master);
    osc.start(startTime);
    osc.stop(startTime + ring + 0.05);

    // 금속성 배음 (오르골 특유의 반짝이는 느낌)
    var shimmer = ctx.createOscillator();
    shimmer.type = 'sine';
    shimmer.frequency.value = freq * 4;
    var shimmerGain = ctx.createGain();
    var shimmerRing = ring * 0.55;
    shimmerGain.gain.setValueAtTime(0, startTime);
    shimmerGain.gain.linearRampToValueAtTime(0.12, startTime + 0.004);
    shimmerGain.gain.exponentialRampToValueAtTime(0.0001, startTime + shimmerRing);
    shimmer.connect(shimmerGain).connect(master);
    shimmer.start(startTime);
    shimmer.stop(startTime + shimmerRing + 0.05);
  }

  function scheduleLoop(){
    if (!playing) return;
    var t = ctx.currentTime + 0.05;
    var cursor = t;
    MELODY.forEach(function(note){
      pluck(note[0], cursor, note[1]);
      cursor += note[1] * BEAT_SEC;
    });
    var totalSec = (cursor - t) + LOOP_GAP_SEC;
    timerId = setTimeout(scheduleLoop, totalSec * 1000);
  }

  function start(){
    ensureCtx();
    if (ctx.state === 'suspended') ctx.resume();
    if (playing) return;
    playing = true;
    scheduleLoop();
  }

  function stop(){
    playing = false;
    if (timerId) clearTimeout(timerId);
    if (master){
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
      setTimeout(function(){
        if (ctx) ctx.suspend();
        if (master) master.gain.setTargetAtTime(0.35, ctx.currentTime, 0.01);
      }, 150);
    }
  }

  return { start: start, stop: stop, isPlaying: function(){ return playing; } };
})();

var musicBtn = document.getElementById('musicToggle');
musicBtn.addEventListener('click', function(){
  if (Music.isPlaying()){
    Music.stop();
    musicBtn.textContent = '🔇';
    musicBtn.classList.remove('playing');
  } else {
    Music.start();
    musicBtn.textContent = '🎵';
    musicBtn.classList.add('playing');
  }
});

// === 인트로 ===
document.getElementById('intro-close').addEventListener('click', function() {
  document.getElementById('intro-overlay').classList.add('hidden');
  localStorage.setItem('nightsky-intro-seen', '1');
  Music.start();
  musicBtn.classList.add('playing');
});
if (localStorage.getItem('nightsky-intro-seen')) {
  document.getElementById('intro-overlay').classList.add('hidden');
}

// === 저장/복원 ===
function saveState() {
  var items = [];
  canvas.querySelectorAll('.placed-item').forEach(function(el) {
    items.push({
      html: el.innerHTML,
      left: el.style.left,
      top: el.style.top,
      glow: el.getAttribute('data-glow') || ''
    });
  });
  localStorage.setItem('nightsky-state', JSON.stringify(items));
}

function loadState() {
  var saved = localStorage.getItem('nightsky-state');
  if (!saved) return;
  try {
    var items = JSON.parse(saved);
    items.forEach(function(data) {
      var el = document.createElement('div');
      el.className = 'placed-item';
      el.innerHTML = data.html;
      el.style.left = data.left;
      el.style.top = data.top;
      el.style.animation = 'none';
      if (data.glow) el.setAttribute('data-glow', data.glow);
      canvas.appendChild(el);
    });
    updateGlows();
  } catch(e) {}
}
loadState();
</script>
