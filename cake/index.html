<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이크 꾸미기</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  touch-action: manipulation;
  color: #4a3b45;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  overscroll-behavior: none;
  background: #1a1028;
}
.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 16px 60px;
  text-align: center;
  position: relative;
}
h1 { font-size: 1.7rem; margin: 0 0 6px; color: #fff; }
.sub { font-size: .92rem; opacity: .7; margin: 0 0 22px; color: #e0d0e8; }
a.back {
  display: inline-block; margin-bottom: 18px;
  font-size: .85rem; color: #c8a0d8; text-decoration: none; opacity: .8;
}
a.back:hover { opacity: 1; }

/* 케이크 스테이지 */
.stage-wrap { display: flex; justify-content: center; padding: 10px 0 26px; }
#cakeStage {
  position: relative;
  width: 360px;
  height: 400px;
  touch-action: none;
  border-radius: 20px;
  overflow: hidden;
}
.stage-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 20px;
}
.cake-base-img {
  position: absolute;
  left: 50%; bottom: 20px;
  transform: translateX(-50%);
  width: 300px;
  height: auto;
  pointer-events: none;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.3));
  z-index: 5;
}
.dropzone-hint {
  position: absolute; inset: 0; z-index: 6;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.5); font-size: .85rem;
  pointer-events: none;
}
#cakeStage.has-gems .dropzone-hint { display: none; }

/* 배치된 토핑 */
.topping-placed {
  position: absolute;
  cursor: grab;
  user-select: none;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
  animation: topPop 0.3s cubic-bezier(.34,1.56,.64,1);
  z-index: 10;
}
.topping-placed:active { cursor: grabbing; }
.topping-placed img {
  width: 100%; height: 100%;
  object-fit: contain;
  pointer-events: none;
}
@keyframes topPop {
  0% { transform: scale(0) rotate(-10deg); opacity: 0; }
  100% { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
}

/* 촛불 */
.candle-item {
  position: absolute;
  z-index: 12;
  pointer-events: none;
  animation: topPop 0.4s cubic-bezier(.34,1.56,.64,1);
}
.candle-item img {
  width: 100%; height: 100%;
  object-fit: contain;
}
.candle-flame {
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%);
  width: 12px; height: 18px;
  background: radial-gradient(ellipse at 50% 80%, #fff 0%, #ffe066 30%, #ff8800 70%, transparent 100%);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  animation: flicker 0.8s ease-in-out infinite alternate;
}
@keyframes flicker {
  0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
  100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 0.85; }
}
.candle-flame.blown-out {
  animation: blowOut 0.5s forwards;
}
@keyframes blowOut {
  0% { opacity: 1; transform: translateX(-50%) scale(1); }
  50% { opacity: 0.5; transform: translateX(-50%) scale(1.5, 0.3); }
  100% { opacity: 0; transform: translateX(-50%) scale(0); }
}

/* 드래그 플로팅 */
.topping-floating {
  position: fixed;
  z-index: 999;
  pointer-events: none;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
.topping-floating img {
  width: 100%; height: 100%;
  object-fit: contain;
}

/* 팔레트 트레이 */
.tray-label { font-size: .85rem; opacity: .7; margin: 6px 0 10px; color: #d0c0e0; }
.tray {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  padding: 14px; margin: 0 auto 18px; max-width: 640px;
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.08);
}
.tray-item {
  width: 46px; height: 46px;
  cursor: grab;
  border-radius: 10px;
  padding: 4px;
  transition: transform 0.15s, background 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.tray-item:hover {
  background: rgba(255,180,220,0.12);
  transform: scale(1.12);
}
.tray-item:active { transform: scale(0.9); }
.tray-item img {
  width: 100%; height: 100%;
  object-fit: contain;
  pointer-events: none;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
}

/* 크기/각도 조절 */
.adjust-panel {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; flex-wrap: wrap;
  margin: 12px auto 18px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.05);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
  max-width: 400px;
}
.adjust-group {
  display: flex; align-items: center; gap: 8px;
}
.adjust-group label {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.5);
  white-space: nowrap;
}
.adjust-group input[type="range"] {
  width: 90px; height: 4px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  outline: none;
}
.adjust-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #c58bf2;
  cursor: pointer;
}

/* 컨트롤 */
.controls {
  display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  margin-top: 12px;
}
.btn {
  border: none; padding: 10px 18px; border-radius: 999px;
  font-size: .85rem; font-weight: 600; cursor: pointer;
  transition: transform 0.1s;
}
.btn:active { transform: scale(.94); }
#resetBtn {
  background: linear-gradient(135deg, #ff9fc7, #c58bf2);
  color: #fff;
  box-shadow: 0 4px 10px rgba(150,80,160,.35);
}
#congratsBtn {
  background: linear-gradient(135deg, #ffd700, #ffaa00);
  color: #fff;
  box-shadow: 0 4px 10px rgba(255,170,0,.35);
}
#musicBtn {
  background: rgba(255,255,255,0.08);
  color: #d0c0e0;
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 0.8rem;
}
.hint { font-size: .75rem; opacity: .5; color: #c0b0d0; margin-top: 10px; }

/* 팡파레 오버레이 */
#fanfareOverlay {
  display: none;
  position: fixed; inset: 0;
  z-index: 2000;
  background: rgba(0,0,0,0.7);
  align-items: center; justify-content: center;
  flex-direction: column;
}
#fanfareOverlay.show { display: flex; }
#fanfareOverlay .msg {
  font-size: 2rem;
  color: #fff;
  animation: fanfarePop 0.5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fanfarePop {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.confetti {
  position: fixed;
  width: 10px; height: 10px;
  border-radius: 2px;
  z-index: 2001;
  pointer-events: none;
  animation: confettiFall 2.5s ease-out forwards;
}
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../">← 홈으로</a>
  <h1>케이크 꾸미기</h1>
  <p class="sub">보석을 드래그해서 케이크에 올려보세요</p>

  <div class="stage-wrap">
    <div id="cakeStage">
      <img class="stage-bg" src="images/back.jpg" alt="">
      <img class="cake-base-img" src="images/cake.png" alt="케이크">
      <div class="dropzone-hint">여기에 보석을 놓아보세요</div>
    </div>
  </div>

  <div class="adjust-panel">
    <div class="adjust-group">
      <label>크기</label>
      <input type="range" id="sizeSlider" min="20" max="80" value="45">
    </div>
    <div class="adjust-group">
      <label>각도</label>
      <input type="range" id="angleSlider" min="-180" max="180" value="0">
    </div>
  </div>

  <div class="tray-label">보석 팔레트</div>
  <div class="tray" id="gemTray"></div>

  <div class="controls">
    <button class="btn" id="musicBtn">♪ 음악</button>
    <button class="btn" id="resetBtn">초기화</button>
    <button class="btn" id="congratsBtn">Congrats!</button>
  </div>
  <p class="hint">올려둔 보석을 더블클릭(더블탭)하면 삭제돼요</p>
</div>

<div id="fanfareOverlay">
  <div class="msg"></div>
</div>

<script>
(function(){
  // === 토핑 목록 ===
  var TOPPINGS = [
    'topping13.png','topping14.png','topping15.png','topping16.png',
    'topping17.png','topping18.png','topping19.png','topping20.png',
    'topping21.png','topping22.png','topping23.png','topping24.png',
    'topping25.png','topping26.png','topping27.png','topping28.png',
    'topping29.png','topping30.png','topping31.png','topping32.png',
    'gem1.png','gem3.png','gem4.png','gem5.png','pearl.png'
  ];

  var stage = document.getElementById('cakeStage');
  var tray = document.getElementById('gemTray');
  var resetBtn = document.getElementById('resetBtn');
  var congratsBtn = document.getElementById('congratsBtn');
  var musicBtn = document.getElementById('musicBtn');
  var sizeSlider = document.getElementById('sizeSlider');
  var angleSlider = document.getElementById('angleSlider');

  // === Web Audio Context ===
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // === 배경음악 — 엘레강스한 멜로디 (아르페지오) ===
  var bgmPlaying = false;
  var bgmInterval = null;
  var bgmGain = null;

  function startBGM() {
    var ctx = getAudioCtx();
    bgmGain = ctx.createGain();
    bgmGain.gain.value = 0.12;
    bgmGain.connect(ctx.destination);

    // 우아한 아르페지오 노트 (C major / Am 계열)
    var notes = [261.6, 329.6, 392.0, 523.3, 392.0, 329.6, 293.7, 349.2, 440.0, 523.3, 440.0, 349.2,
                 261.6, 311.1, 392.0, 466.2, 392.0, 311.1, 293.7, 370.0, 440.0, 554.4, 440.0, 370.0];
    var i = 0;

    function playNote() {
      var osc = ctx.createOscillator();
      var env = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = notes[i % notes.length];
      env.gain.setValueAtTime(0.3, ctx.currentTime);
      env.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
      osc.connect(env);
      env.connect(bgmGain);
      osc.start();
      osc.stop(ctx.currentTime + 1.3);
      i++;
    }

    playNote();
    bgmInterval = setInterval(playNote, 700);
    bgmPlaying = true;
    musicBtn.textContent = '♪ 음악 끄기';
  }

  function stopBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    bgmInterval = null;
    bgmPlaying = false;
    musicBtn.textContent = '♪ 음악';
  }

  musicBtn.addEventListener('click', function() {
    if (bgmPlaying) stopBGM();
    else startBGM();
  });

  // === 보석 배치 효과음 (반짝 소리) ===
  function playSparkle() {
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var osc2 = ctx.createOscillator();
    var gain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(2400, ctx.currentTime + 0.08);
    osc.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.15);

    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(1800, ctx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(3200, ctx.currentTime + 0.1);

    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc2.start();
    osc.stop(ctx.currentTime + 0.35);
    osc2.stop(ctx.currentTime + 0.35);
  }

  // === 팡파레 효과음 ===
  function playFanfare() {
    var ctx = getAudioCtx();
    var fanNotes = [523.3, 659.3, 784.0, 1047];
    fanNotes.forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
      gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + i * 0.15 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.7);
    });
  }

  // === 팔레트 렌더링 ===
  TOPPINGS.forEach(function(file) {
    var item = document.createElement('div');
    item.className = 'tray-item';
    item.setAttribute('data-file', file);
    var img = document.createElement('img');
    img.src = 'images/' + file;
    item.appendChild(img);
    tray.appendChild(item);

    item.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      var pointerId = e.pointerId;
      var size = parseInt(sizeSlider.value);

      var clone = document.createElement('div');
      clone.className = 'topping-floating';
      clone.style.width = size + 'px';
      clone.style.height = size + 'px';
      var cloneImg = document.createElement('img');
      cloneImg.src = 'images/' + file;
      clone.appendChild(cloneImg);
      clone.style.transform = 'rotate(' + angleSlider.value + 'deg)';
      document.body.appendChild(clone);

      function moveClone(x, y) {
        clone.style.left = (x - size/2) + 'px';
        clone.style.top = (y - size/2) + 'px';
      }
      moveClone(e.clientX, e.clientY);

      function onMove(ev) {
        if (ev.pointerId !== pointerId) return;
        moveClone(ev.clientX, ev.clientY);
      }
      function onUp(ev) {
        if (ev.pointerId !== pointerId) return;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        var rect = stage.getBoundingClientRect();
        if (ev.clientX >= rect.left && ev.clientX <= rect.right &&
            ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
          placeTopping(file, ev.clientX - rect.left, ev.clientY - rect.top);
        }
        clone.remove();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });

  // === 토핑 배치 ===
  function placeTopping(file, x, y) {
    var size = parseInt(sizeSlider.value);
    var angle = parseInt(angleSlider.value);
    var el = document.createElement('div');
    el.className = 'topping-placed';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (x - size/2) + 'px';
    el.style.top = (y - size/2) + 'px';
    el.style.transform = 'rotate(' + angle + 'deg)';
    el.setAttribute('data-file', file);

    var img = document.createElement('img');
    img.src = 'images/' + file;
    el.appendChild(img);
    stage.appendChild(el);
    stage.classList.add('has-gems');
    playSparkle();
    attachPlacedInteraction(el);
  }

  // === 배치된 토핑 인터랙션 ===
  function attachPlacedInteraction(el) {
    var lastTap = 0;
    el.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var now = Date.now();
      if (now - lastTap < 350) {
        el.style.transition = 'transform 0.2s, opacity 0.2s';
        el.style.transform = 'scale(0)';
        el.style.opacity = '0';
        setTimeout(function() {
          el.remove();
          if (!stage.querySelector('.topping-placed')) stage.classList.remove('has-gems');
        }, 200);
        return;
      }
      lastTap = now;

      var pointerId = e.pointerId;
      var startLeft = el.offsetLeft, startTop = el.offsetTop;
      var startX = e.clientX, startY = e.clientY;

      function onMove(ev) {
        if (ev.pointerId !== pointerId) return;
        el.style.left = (startLeft + (ev.clientX - startX)) + 'px';
        el.style.top = (startTop + (ev.clientY - startY)) + 'px';
      }
      function onUp(ev) {
        if (ev.pointerId !== pointerId) return;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }

  // === 초기화 ===
  resetBtn.addEventListener('click', function() {
    stage.querySelectorAll('.topping-placed, .candle-item').forEach(function(g) { g.remove(); });
    stage.classList.remove('has-gems');
  });

  // === Congrats! — 촛불 + 불기 감지 ===
  var candleLit = false;
  var blowStream = null;
  var blowAnalyser = null;

  congratsBtn.addEventListener('click', function() {
    // 촛불 생성
    var candle = document.createElement('div');
    candle.className = 'candle-item';
    candle.style.width = '40px';
    candle.style.height = '80px';
    candle.style.left = '50%';
    candle.style.top = '30px';
    candle.style.transform = 'translateX(-50%)';
    var cImg = document.createElement('img');
    cImg.src = 'images/candle.png';
    candle.appendChild(cImg);
    var flame = document.createElement('div');
    flame.className = 'candle-flame';
    candle.appendChild(flame);
    stage.appendChild(candle);
    candleLit = true;

    // 마이크 접근해서 불기 감지
    startBlowDetection(flame, candle);
  });

  function startBlowDetection(flame, candle) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      blowStream = stream;
      var ctx = getAudioCtx();
      var source = ctx.createMediaStreamSource(stream);
      blowAnalyser = ctx.createAnalyser();
      blowAnalyser.fftSize = 256;
      source.connect(blowAnalyser);
      var data = new Uint8Array(blowAnalyser.frequencyBinCount);

      function check() {
        if (!candleLit) return;
        blowAnalyser.getByteFrequencyData(data);
        // 저주파 에너지 (불기 = 저주파 노이즈)
        var low = 0;
        for (var i = 0; i < 10; i++) low += data[i];
        low /= 10;

        if (low > 120) {
          // 불 꺼짐!
          candleLit = false;
          flame.classList.add('blown-out');
          stream.getTracks().forEach(function(t) { t.stop(); });
          setTimeout(function() {
            triggerFanfare();
          }, 600);
        } else {
          requestAnimationFrame(check);
        }
      }
      check();
    }).catch(function() {
      // 마이크 권한 거부 시 — 3초 후 자동으로 꺼짐
      setTimeout(function() {
        if (candleLit) {
          candleLit = false;
          flame.classList.add('blown-out');
          setTimeout(triggerFanfare, 600);
        }
      }, 3000);
    });
  }

  function triggerFanfare() {
    playFanfare();
    spawnConfetti();
    var overlay = document.getElementById('fanfareOverlay');
    overlay.querySelector('.msg').textContent = '🎉 Happy Birthday! 🎉';
    overlay.classList.add('show');
    setTimeout(function() { overlay.classList.remove('show'); }, 3000);
  }

  function spawnConfetti() {
    var colors = ['#ff6b9d','#c44dff','#4dc9ff','#ffd700','#4dff88','#ff4d6a','#a855f7'];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (6 + Math.random() * 8) + 'px';
      c.style.height = (6 + Math.random() * 8) + 'px';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      c.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      document.body.appendChild(c);
      setTimeout(function(el) { el.remove(); }.bind(null, c), 4000);
    }
  }

})();
</script>
</body>
</html>
