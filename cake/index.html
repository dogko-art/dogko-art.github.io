<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이크 꾸미기</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    touch-action: manipulation;
    background: radial-gradient(circle at 20% 0%, #eef2ff, #fdeef3 60%);
    color: #4a3b45;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 60px;
    text-align: center;
  }
  h1 { font-size: 1.7rem; margin: 0 0 6px; }
  .sub { font-size: .95rem; opacity: .75; margin: 0 0 22px; }
  a.back {
    display: inline-block; margin-bottom: 18px;
    font-size: .85rem; color: #8a6a76; text-decoration: none; opacity: .8;
  }
  a.back:hover { opacity: 1; }

  /* 케이크 스테이지 */
  .stage-wrap { display: flex; justify-content: center; padding: 10px 0 26px; }
  #cakeStage {
    position: relative;
    width: 340px;
    height: 380px;
    touch-action: none;
  }
  .cake-base-img {
    position: absolute;
    left: 50%; bottom: 10px;
    transform: translateX(-50%);
    width: 320px;
    height: auto;
    pointer-events: none;
    filter: drop-shadow(0 12px 20px rgba(80,40,60,0.25));
  }
  .dropzone-hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #b98a9a; font-size: .85rem; opacity: .55;
    pointer-events: none;
  }
  #cakeStage.has-gems .dropzone-hint { display: none; }

  /* 배치된 토핑 */
  .topping-placed {
    position: absolute;
    cursor: grab;
    user-select: none;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
    animation: topPop 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .topping-placed:active { cursor: grabbing; }
  .topping-placed img {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  @keyframes topPop {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* 드래그 중인 플로팅 토핑 */
  .topping-floating {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }
  .topping-floating img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* 팔레트 트레이 */
  .tray-label { font-size: .85rem; opacity: .7; margin: 6px 0 10px; }
  .tray {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
    padding: 14px; margin: 0 auto 18px; max-width: 640px;
    background: rgba(255,255,255,.55);
    border-radius: 18px;
    box-shadow: 0 4px 14px rgba(80,40,60,.08);
  }
  .tray-item {
    width: 48px; height: 48px;
    cursor: grab;
    border-radius: 10px;
    padding: 4px;
    transition: transform 0.15s, background 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .tray-item:hover {
    background: rgba(255,180,220,0.15);
    transform: scale(1.1);
  }
  .tray-item:active { transform: scale(0.9); }
  .tray-item img {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
  }

  /* 컨트롤 */
  .controls {
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  }
  button#resetBtn {
    border: none; padding: 10px 18px; border-radius: 999px;
    background: linear-gradient(135deg, #ff9fc7, #c58bf2);
    color: #fff; font-size: .9rem; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(150,80,160,.35);
  }
  button#resetBtn:active { transform: scale(.96); }
  .hint { font-size: .8rem; opacity: .6; }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../">← 홈으로</a>
  <h1>케이크 꾸미기</h1>
  <p class="sub">아래 보석을 케이크 위로 드래그해서 나만의 케이크를 완성해보세요</p>

  <div class="stage-wrap">
    <div id="cakeStage">
      <img class="cake-base-img" src="images/cake.png" alt="케이크">
      <div class="dropzone-hint">여기에 보석을 놓아보세요</div>
    </div>
  </div>

  <div class="tray-label">보석 팔레트 — 드래그해서 케이크에 올려보세요</div>
  <div class="tray" id="gemTray"></div>

  <div class="controls">
    <button id="resetBtn">초기화</button>
    <span class="hint">올려둔 보석을 더블클릭(더블탭)하면 삭제돼요</span>
  </div>
</div>

<script>
(function(){
  // 토핑 이미지 목록
  var TOPPINGS = [
    'topping13.png','topping14.png','topping15.png','topping16.png',
    'topping17.png','topping18.png','topping19.png','topping20.png',
    'topping21.png','topping22.png','topping23.png','topping24.png',
    'topping25.png','topping26.png','topping27.png','topping28.png',
    'topping29.png','topping30.png','topping31.png','topping32.png',
    'gem1.png','gem3.png','gem4.png','gem5.png'
  ];

  var stage = document.getElementById('cakeStage');
  var tray = document.getElementById('gemTray');
  var resetBtn = document.getElementById('resetBtn');

  // 팔레트 렌더링
  TOPPINGS.forEach(function(file) {
    var item = document.createElement('div');
    item.className = 'tray-item';
    item.setAttribute('data-file', file);
    var img = document.createElement('img');
    img.src = 'images/' + file;
    img.alt = file;
    item.appendChild(img);
    tray.appendChild(item);

    // 드래그 시작
    item.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      var pointerId = e.pointerId;
      var size = 50;

      var clone = document.createElement('div');
      clone.className = 'topping-floating';
      clone.style.width = size + 'px';
      clone.style.height = size + 'px';
      var cloneImg = document.createElement('img');
      cloneImg.src = 'images/' + file;
      clone.appendChild(cloneImg);
      document.body.appendChild(clone);

      function moveClone(x, y) {
        clone.style.left = (x - size/2) + 'px';
        clone.style.top = (y - size/2) + 'px';
      }
      moveClone(e.clientX, e.clientY);

      function onMove(ev) {
        if (ev.pointerId !== pointerId) return;
        moveClone(ev.clientX, ev.clientY);
      }
      function onUp(ev) {
        if (ev.pointerId !== pointerId) return;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        var rect = stage.getBoundingClientRect();
        if (ev.clientX >= rect.left && ev.clientX <= rect.right &&
            ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
          placeTopping(file, ev.clientX - rect.left, ev.clientY - rect.top);
        }
        clone.remove();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });

  // 케이크 위에 토핑 배치
  function placeTopping(file, x, y) {
    var size = 35 + Math.random() * 20;
    var el = document.createElement('div');
    el.className = 'topping-placed';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (x - size/2) + 'px';
    el.style.top = (y - size/2) + 'px';
    el.style.transform = 'rotate(' + (Math.random() * 30 - 15) + 'deg)';
    el.setAttribute('data-file', file);

    var img = document.createElement('img');
    img.src = 'images/' + file;
    el.appendChild(img);
    stage.appendChild(el);
    stage.classList.add('has-gems');

    attachPlacedInteraction(el);
  }

  // 배치된 토핑: 드래그 이동 + 더블클릭 삭제
  function attachPlacedInteraction(el) {
    var lastTap = 0;
    el.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();

      var now = Date.now();
      if (now - lastTap < 350) {
        el.style.transition = 'transform 0.2s, opacity 0.2s';
        el.style.transform = 'scale(0)';
        el.style.opacity = '0';
        setTimeout(function() {
          el.remove();
          if (!stage.querySelector('.topping-placed')) stage.classList.remove('has-gems');
        }, 200);
        return;
      }
      lastTap = now;

      var pointerId = e.pointerId;
      var startLeft = el.offsetLeft, startTop = el.offsetTop;
      var startX = e.clientX, startY = e.clientY;

      function onMove(ev) {
        if (ev.pointerId !== pointerId) return;
        el.style.left = (startLeft + (ev.clientX - startX)) + 'px';
        el.style.top = (startTop + (ev.clientY - startY)) + 'px';
      }
      function onUp(ev) {
        if (ev.pointerId !== pointerId) return;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }

  // 초기화
  resetBtn.addEventListener('click', function() {
    stage.querySelectorAll('.topping-placed').forEach(function(g) { g.remove(); });
    stage.classList.remove('has-gems');
  });
})();
</script>
</body>
</html>
