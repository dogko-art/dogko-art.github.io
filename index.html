<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dogko-art</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #4a3b45;
    background: radial-gradient(circle at 15% 0%, #eef2ff, #fdeef3 60%);
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* 왼쪽 1/4: 목록 */
  .sidebar {
    width: 25%;
    min-width: 210px;
    max-width: 300px;
    padding: 40px 24px;
    background: rgba(255,255,255,.55);
    border-right: 1px solid rgba(0,0,0,.05);
    position: sticky;
    top: 0;
    align-self: flex-start;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    font-size: 1.3rem;
    font-weight: 700;
  }
  .tagline {
    font-size: .85rem;
    opacity: .6;
    margin: 4px 0 26px;
  }
  .proj-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .proj-list a {
    text-decoration: none;
    color: #4a3b45;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 500;
    transition: background .15s;
  }
  .proj-list a:hover {
    background: rgba(255,159,199,.22);
  }

  /* 오른쪽 3/4: 썸네일 */
  .gallery {
    flex: 1;
    padding: 40px 34px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
    align-content: start;
  }
  .thumb-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(160deg, #ffffff, #fbf4f8);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(80,40,60,.12);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .thumb-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 32px rgba(80,40,60,.22);
  }
  .thumb-visual {
    height: 220px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 사탕 아이콘 */
  .candy-icon {
    width: 62%;
    max-width: 170px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    /* 흰 배경을 자연스럽게 녹이기 위한 그림자 + 블렌드 */
    mix-blend-mode: multiply;
    filter: drop-shadow(0 10px 16px rgba(80,40,60,.18));
    transition: transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .thumb-card:hover .candy-icon {
    transform: scale(1.18) rotate(-4deg);
  }

  /* 제목: 평소엔 숨김, hover 시 아래에서 떠오름 */
  .thumb-title {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 16px;
    text-align: center;
    font-weight: 700;
    font-size: 1rem;
    color: #4a3b45;
    background: linear-gradient(to top, rgba(255,255,255,.92), rgba(255,255,255,0));
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
  }
  .thumb-card:hover .thumb-title {
    opacity: 1;
    transform: translateY(0);
  }
  .thumb-emoji {
    width: 55%;
    max-width: 150px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.4rem;
    transition: transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .thumb-card:hover .thumb-emoji {
    transform: scale(1.18) rotate(-4deg);
  }

  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      max-width: none;
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid rgba(0,0,0,.05);
    }
    .proj-list { flex-direction: row; flex-wrap: wrap; }
    .gallery { padding: 26px 18px; }
  }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">🎨 dogko-art</div>
      <p class="tagline">만든 것들</p>
      <nav class="proj-list" id="projNav"></nav>
    </aside>
    <main class="gallery" id="gallery"></main>
  </div>

<script>
(function(){
  var PROJECTS = [
    { title: "케이크 꾸미기", href: "cake/", candy: "assets/candy-pink.jpg" },
    { title: "번호 뽑기", href: "lotto/", candy: "assets/candy-green.jpg" },
    { title: "밤하늘 꾸미기", href: "nightsky/", candy: "assets/candy-blue.jpg" }
  ];

  var nav = document.getElementById("projNav");
  var gallery = document.getElementById("gallery");

  PROJECTS.forEach(function(p){
    var link = document.createElement("a");
    link.href = p.href;
    link.textContent = p.title;
    nav.appendChild(link);

    var card = document.createElement("a");
    card.className = "thumb-card";
    card.href = p.href;
    card.setAttribute("aria-label", p.title);

    var visual = document.createElement("div");
    visual.className = "thumb-visual";

    var icon = document.createElement("img");
    icon.className = "candy-icon";
    icon.src = p.candy;
    icon.alt = p.title;
    icon.loading = "lazy";
    visual.appendChild(icon);

    var title = document.createElement("div");
    title.className = "thumb-title";
    title.textContent = p.title;

    card.appendChild(visual);
    card.appendChild(title);
    gallery.appendChild(card);
  });
})();
</script>
</body>
</html>
