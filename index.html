<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dogko-art</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #4a3b45;
    background: radial-gradient(circle at 15% 0%, #eef2ff, #fdeef3 60%);
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* 왼쪽 1/4: 목록 */
  .sidebar {
    width: 25%;
    min-width: 210px;
    max-width: 300px;
    padding: 40px 24px;
    background: rgba(255,255,255,.55);
    border-right: 1px solid rgba(0,0,0,.05);
    position: sticky;
    top: 0;
    align-self: flex-start;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    font-size: 1.3rem;
    font-weight: 700;
  }
  .tagline {
    font-size: .85rem;
    opacity: .6;
    margin: 4px 0 26px;
  }
  .proj-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .proj-list a {
    text-decoration: none;
    color: #4a3b45;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 500;
    transition: background .15s;
  }
  .proj-list a:hover {
    background: rgba(255,159,199,.22);
  }

  /* 오른쪽 3/4: 썸네일 */
  .gallery {
    flex: 1;
    padding: 40px 34px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
    align-content: start;
  }
  .thumb-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(80,40,60,.12);
    transition: transform .18s, box-shadow .18s;
  }
  .thumb-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 26px rgba(80,40,60,.2);
  }
  .thumb-visual {
    height: 160px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fdeef3, #eef2ff);
  }
  .thumb-title {
    padding: 14px 16px;
    font-weight: 600;
    font-size: .95rem;
  }
  .thumb-emoji {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }

  /* 케이크 꾸미기 썸네일 미니 일러스트 */
  .mini-cake {
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    width: 74px; height: 96px;
  }
  .mini-slice {
    position: absolute;
    inset: 0 0 16px 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 6px 6px 4px 4px;
    box-shadow: 0 8px 14px rgba(80,40,60,.22);
  }
  .mini-sponge {
    flex: 2.2;
    background:
      radial-gradient(circle at 20% 25%, #ff86c8 0 2px, transparent 3px),
      radial-gradient(circle at 65% 15%, #6fc6ff 0 2px, transparent 3px),
      radial-gradient(circle at 40% 60%, #ffd166 0 2px, transparent 3px),
      radial-gradient(circle at 80% 65%, #9b8cff 0 2px, transparent 3px),
      radial-gradient(circle at 15% 80%, #5ee6b0 0 2px, transparent 3px),
      #fbeecb;
    background-size: 15px 15px, 17px 17px, 14px 14px, 16px 16px, 15px 15px, auto;
  }
  .mini-cream {
    flex: .5;
    background: #fffaf1;
  }
  .mini-cap {
    position: absolute;
    top: -11px; left: -3px; right: -3px;
    height: 22px;
    background: #fffaf1;
    border-radius: 50% 50% 6px 6px / 60% 60% 6px 6px;
    box-shadow: 0 3px 5px rgba(80,40,60,.15);
  }
  .mini-gem {
    position: absolute;
    border-radius: 50%;
    box-shadow: 0 2px 3px rgba(0,0,0,.3);
  }
  .mini-gem.g1 { width: 15px; height: 15px; left: 8px; top: 18px; background: radial-gradient(circle at 30% 25%, #fff, #ff9fc7 40%, #c02368); }
  .mini-gem.g2 {
    width: 13px; height: 15px; left: 44px; top: 4px;
    background: radial-gradient(circle at 30% 25%, #fff, #9c6bf0 40%, #5a2ba8);
    clip-path: polygon(50% 0%, 100% 45%, 50% 100%, 0% 45%);
    border-radius: 0;
  }
  .mini-gem.g3 { width: 14px; height: 14px; left: 26px; top: 40px; background: radial-gradient(circle at 30% 25%, #fff, #34c99a 40%, #0d7f63); }

  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      max-width: none;
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid rgba(0,0,0,.05);
    }
    .proj-list { flex-direction: row; flex-wrap: wrap; }
    .gallery { padding: 26px 18px; }
  }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">🎨 dogko-art</div>
      <p class="tagline">만든 것들</p>
      <nav class="proj-list" id="projNav"></nav>
    </aside>
    <main class="gallery" id="gallery"></main>
  </div>

<script>
(function(){
  var PROJECTS = [
    { title: "케이크 꾸미기", href: "cake/", thumb: "cake" },
    { title: "번호 뽑기", href: "lotto/", emoji: "💎" },
    { title: "밤하늘 꾸미기", href: "nightsky/", emoji: "🌙" }
  ];

  var nav = document.getElementById("projNav");
  var gallery = document.getElementById("gallery");

  PROJECTS.forEach(function(p){
    var link = document.createElement("a");
    link.href = p.href;
    link.textContent = p.title;
    nav.appendChild(link);

    var card = document.createElement("a");
    card.className = "thumb-card";
    card.href = p.href;

    var visual = document.createElement("div");
    visual.className = "thumb-visual";

    if (p.thumb === "cake") {
      visual.innerHTML =
        '<div class="mini-cake">' +
          '<div class="mini-slice">' +
            '<div class="mini-sponge"></div>' +
            '<div class="mini-cream"></div>' +
            '<div class="mini-sponge"></div>' +
          '</div>' +
          '<div class="mini-cap"></div>' +
          '<div class="mini-gem g1"></div>' +
          '<div class="mini-gem g2"></div>' +
          '<div class="mini-gem g3"></div>' +
        '</div>';
    } else {
      var emoji = document.createElement("div");
      emoji.className = "thumb-emoji";
      emoji.textContent = p.emoji || "✨";
      visual.appendChild(emoji);
    }

    var title = document.createElement("div");
    title.className = "thumb-title";
    title.textContent = p.title;

    card.appendChild(visual);
    card.appendChild(title);
    gallery.appendChild(card);
  });
})();
</script>
</body>
</html>
