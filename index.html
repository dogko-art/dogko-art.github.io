<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dogko-art</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #4a3b45;
    background: radial-gradient(circle at 50% 0%, #f3f6ff, #e9edf7 70%);
  }

  .brand {
    position: fixed;
    top: 26px;
    left: 30px;
    font-size: 1.25rem;
    font-weight: 700;
    color: #6a7b9a;
    z-index: 20;
  }
  .tagline {
    position: fixed;
    top: 54px;
    left: 30px;
    font-size: .82rem;
    opacity: .55;
    z-index: 20;
  }

  /* ============================
     스푼 + 우유 (기본 배경)
     ============================ */
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  /* 스푼 + 우유 실사 이미지 */
  .spoon {
    position: relative;
    width: min(72vw, 460px);
    aspect-ratio: 239 / 320;
    background: url("assets/spoon-milk.png") center / contain no-repeat;
    filter: drop-shadow(0 20px 40px rgba(70,80,110,.28));
  }

  /* ============================
     시리얼 글자 아이콘
     — 우유 타원 영역에만 배치 (이미지 기준 좌표)
     ============================ */
  .cereal-field {
    position: absolute;
    /* 스푼 이미지에서 우유가 담긴 타원 영역 */
    left: 17%;
    right: 17%;
    top: 13%;
    bottom: 38%;
    z-index: 4;
  }

  .cereal {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    /* x,y 좌표를 글자 중심 기준으로 맞추기 위해 -50% 보정 */
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  }
  .cereal:hover {
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1.14);
    z-index: 10;
  }

  /* 시리얼 글자 실사 이미지 (배경 투명 처리됨) */
  .cereal-letter {
    display: block;
    width: var(--size, 120px);
    height: auto;
    user-select: none;
    pointer-events: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 5px 8px rgba(90,70,50,.3));
  }

  /* 제목: hover 시 시리얼 위에 떠오름 */
  .cereal-title {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(8px) rotate(calc(var(--rot, 0deg) * -1));
    white-space: nowrap;
    background: rgba(74,59,69,.92);
    color: #fff;
    font-size: .85rem;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    box-shadow: 0 6px 16px rgba(80,40,60,.25);
  }
  .cereal-title::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: rgba(74,59,69,.92);
  }
  .cereal:hover .cereal-title {
    opacity: 1;
    transform: translateX(-50%) translateY(0) rotate(calc(var(--rot, 0deg) * -1));
  }

  @media (max-width: 600px) {
    .cereal-letter { font-size: calc(var(--size, 86px) * 0.7); -webkit-text-stroke-width: 7px; }
  }
</style>
</head>
<body>
  <div class="brand">🥣 dogko-art</div>
  <p class="tagline">만든 것들</p>

  <div class="stage">
    <div class="spoon">
      <div class="cereal-field" id="cerealField"></div>
    </div>
  </div>

<script>
(function(){
  var PROJECTS = [
    {
      title: "케이크 꾸미기", href: "cake/", img: "assets/cereal-c.png",
      size: 86, x: 44, y: 34, rot: -8
    },
    {
      title: "번호 뽑기", href: "lotto/", img: "assets/cereal-n.png",
      size: 92, x: 62, y: 56, rot: 7
    },
    {
      title: "밤하늘 꾸미기", href: "nightsky/", img: "assets/cereal-s.png",
      size: 82, x: 38, y: 72, rot: -5
    }
  ];

  var field = document.getElementById("cerealField");

  PROJECTS.forEach(function(p){
    var cereal = document.createElement("a");
    cereal.className = "cereal";
    cereal.href = p.href;
    cereal.setAttribute("aria-label", p.title);
    cereal.style.left = p.x + "%";
    cereal.style.top = p.y + "%";
    cereal.style.setProperty("--rot", p.rot + "deg");
    cereal.style.setProperty("--size", p.size + "px");

    var letter = document.createElement("img");
    letter.className = "cereal-letter";
    letter.src = p.img;
    letter.alt = p.title;
    letter.loading = "lazy";

    var title = document.createElement("span");
    title.className = "cereal-title";
    title.textContent = p.title;

    cereal.appendChild(title);
    cereal.appendChild(letter);
    field.appendChild(cereal);
  });
})();
</script>
</body>
</html>
