<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dogko-art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }
  p {
    font-size: 1.1rem;
    opacity: 0.9;
    line-height: 1.6;
  }
  .badge {
    display: inline-block;
    margin-top: 24px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    font-size: 0.9rem;
  }
  .links {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .links a {
    color: #fff;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    transition: background 0.15s;
  }
  .links a:hover {
    background: rgba(255,255,255,0.22);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>👋 안녕하세요</h1>
    <p>여기는 <strong>dogko-art</strong>의 첫 GitHub Pages 웹사이트입니다.<br>앞으로 이곳에 다양한 프로젝트를 올릴 예정이에요.</p>
    <div class="badge">🚀 첫 배포 완료</div>
    <div class="links">
      <a href="cake/">🎂 케이크 꾸미기 놀이</a>
    </div>
  </div>
</body>
</html>
